<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Se connecter — Esquisse</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <div class="auth">
    <a class="auth__brand" href="projets.html"><span class="mark" aria-hidden="true"></span>Esquisse</a>

    <div class="auth__card">
      <div class="tabs" role="tablist" aria-label="Connexion ou création de compte">
        <button class="tabs__tab" role="tab" id="onglet-connexion" aria-controls="volet-connexion"
                aria-selected="true" tabindex="0" type="button">Se connecter</button>
        <button class="tabs__tab" role="tab" id="onglet-creation" aria-controls="volet-creation"
                aria-selected="false" tabindex="-1" type="button">Créer un compte</button>
      </div>

      <!-- Connexion ------------------------------------------------------ -->
      <form id="volet-connexion" role="tabpanel" aria-labelledby="onglet-connexion" novalidate>
        <label class="field">
          <span class="field__label">Adresse e-mail</span>
          <input class="input" type="email" autocomplete="email" placeholder="vous@exemple.fr">
        </label>
        <label class="field">
          <span class="field__label">Mot de passe</span>
          <input class="input" type="password" autocomplete="current-password">
        </label>
        <div style="margin-top:1.125rem">
          <button class="btn btn--primary btn--block" type="submit">Se connecter</button>
        </div>
      </form>

      <!-- Création ------------------------------------------------------- -->
      <form id="volet-creation" role="tabpanel" aria-labelledby="onglet-creation" hidden novalidate>
        <div class="callout callout--stop" role="alert" style="margin-bottom:1rem">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/></svg>
          <span class="callout__body">Cette adresse a déjà un compte. Connectez-vous, ou choisissez-en une autre.</span>
        </div>
        <label class="field">
          <span class="field__label">Adresse e-mail</span>
          <input class="input" type="email" autocomplete="email" aria-invalid="true" value="marion.leduc@atelier-noria.fr">
        </label>
        <label class="field">
          <span class="field__label">Mot de passe</span>
          <input class="input" type="password" autocomplete="new-password">
          <span class="field__hint">Dix caractères au moins.</span>
        </label>
        <div style="margin-top:1.125rem">
          <button class="btn btn--primary btn--block" type="submit">Demander un accès</button>
        </div>
      </form>
    </div>

    <p class="auth__foot">
      L'accès se fait sur demande. Le compte est créé tout de suite, et activé à la main
      avant la première rédaction.
    </p>
  </div>
</div>
<script src="js/mock.js"></script>
</body>
</html>
