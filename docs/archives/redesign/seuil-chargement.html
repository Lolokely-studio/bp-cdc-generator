<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seuil, chargement — Esquisse</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <p class="sr" role="status">Ouverture de votre espace.</p>
  <header class="topbar skeleton">
    <!-- La marque est connue d'avance : on la pose, on ne l'esquisse pas. -->
    <span class="brand"><span class="mark" aria-hidden="true"></span>Esquisse</span>
    <span class="bone bone--crumb" aria-hidden="true"></span>
    <span class="bone bone--avatar" aria-hidden="true"></span>
  </header>
  <!-- Le corps reste vide à dessein : cette garde enveloppe toutes les
       pages, et elles n'ont pas la même forme. Chaque écran a son propre
       squelette, qui prend le relais. -->
</div>
</body>
</html>
