<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esquisse — Parcours simple</title>
<script>(function(){try{var t=localStorage.getItem("esquisse-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --card:#FFFFFF; --soft:#F1EFE9;
  --ink:#1C1F26; --ink-2:#5C6270; --ink-3:#8A909C;
  --rule:#E5E2DA; --rule-2:#CFCBC1;
  --acc:#23408E; --acc-soft:#E7EBF6; --acc-ink:#FFFFFF;
  --warn:#8A5A16; --warn-soft:#F6EEDF;
  --danger:#A5342A;
  --f:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --lift:0 1px 2px rgba(28,31,38,.04), 0 12px 28px -16px rgba(28,31,38,.26);
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161A; --card:#1C1F25; --soft:#232730;
  --ink:#EDEEF1; --ink-2:#A0A6B2; --ink-3:#7C8390;
  --rule:#2A2E37; --rule-2:#3B404B;
  --acc:#8FA6E8; --acc-soft:#1E2640; --acc-ink:#111521;
  --warn:#D9A45E; --warn-soft:#2E2415;
  --danger:#EE8578;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -18px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#14161A; --card:#1C1F25; --soft:#232730;
  --ink:#EDEEF1; --ink-2:#A0A6B2; --ink-3:#7C8390;
  --rule:#2A2E37; --rule-2:#3B404B;
  --acc:#8FA6E8; --acc-soft:#1E2640; --acc-ink:#111521;
  --warn:#D9A45E; --warn-soft:#2E2415;
  --danger:#EE8578;
  --lift:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -18px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
h1,h2,h3,p,ul,ol{margin:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- En-tête ---------- */
.hd{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--rule)}
.hd-in{max-width:1000px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.brand svg{width:16px;height:20px;display:block;flex:none;color:var(--acc)}
.hd-r{display:flex;align-items:center;gap:14px}
.saved{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink-3)}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.theme{display:flex;gap:2px;padding:2px;border:1px solid var(--rule-2);border-radius:999px;background:var(--card)}
.theme button{width:34px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--ink-3)}
.theme button svg{width:16px;height:16px;display:block}
.theme button[aria-pressed="false"]:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Avancement ---------- */
.pg{border-bottom:1px solid var(--rule);background:var(--card)}
.pg-in{max-width:1000px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pg-b{flex:1;min-width:140px;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.pg-b i{display:block;height:100%;background:var(--acc);border-radius:999px}
.pg-t{font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.pg-t b{color:var(--ink);font-weight:600}
.pg-a{font-size:14.5px;color:var(--acc);font-weight:500;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.pg-a:hover{color:var(--ink)}

/* ---------- Colonne ---------- */
main{max-width:1000px;margin:0 auto;padding:0 24px}
.col{max-width:640px;margin:0 auto;padding:44px 0 88px}
.col.wide{max-width:780px}
.eyebrow{display:inline-block;font-size:14px;font-weight:500;color:var(--acc);background:var(--acc-soft);padding:4px 11px;border-radius:999px;margin-bottom:14px}
h1.t{font-size:clamp(27px,3.4vw,36px);font-weight:600;letter-spacing:-.022em;line-height:1.18;text-wrap:balance}
h1.t:focus{outline:none}
.lead{font-size:18px;color:var(--ink-2);margin-top:12px;max-width:52ch}
.sub{font-size:15.5px;color:var(--ink-2)}
.small{font-size:14.5px}

/* ---------- Actions : une seule principale ---------- */
.go{display:inline-flex;align-items:center;justify-content:center;background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:14px 26px;font-size:17px;font-weight:600;min-height:52px}
.go:hover{filter:brightness(1.12)}
.go.quiet{background:var(--card);color:var(--ink);border:1.5px solid var(--rule-2)}
.go.quiet:hover{filter:none;border-color:var(--ink);background:var(--soft)}
.go:disabled{opacity:.45;cursor:default;filter:none}
.after{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:28px}
.link{font-size:16px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.link.warn{color:var(--warn)}

/* ---------- Cartes de question ---------- */
.q{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px;margin-bottom:14px}
.q.dim{background:var(--soft);border-style:dashed}
.q-l{display:block;font-size:17.5px;font-weight:500;line-height:1.4;margin-bottom:14px}
.in{width:100%;border:1.5px solid var(--rule-2);border-radius:9px;padding:13px 15px;font-size:17px;background:var(--bg);color:var(--ink);min-height:52px}
.in::placeholder{color:var(--ink-3)}
.in:focus{border-color:var(--acc)}
.in.bad{border-color:var(--danger)}
textarea.in{resize:vertical;line-height:1.6}
.q-row{display:flex;gap:10px;align-items:flex-start}
.q-row .in{flex:1}
.dunno{flex:none;border:1.5px solid var(--rule-2);border-radius:9px;background:var(--soft);padding:13px 15px;font-size:15.5px;font-weight:500;color:var(--ink-2);min-height:52px;white-space:nowrap}
.dunno:hover{border-color:var(--ink);color:var(--ink)}
.dunno[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:500}
.q-note{font-size:14.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}
.q-err{font-size:15px;color:var(--danger);margin-top:10px}
.q-ans{font-size:16px;color:var(--ink-2);font-style:italic}

/* ---------- Choix ---------- */
.opts{display:grid;gap:12px;margin-top:26px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:16px;background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);padding:20px 22px;align-items:start}
.opt:hover{border-color:var(--rule-2);background:var(--soft)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.opt .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule-2);margin-top:3px;position:relative}
.opt[aria-pressed="true"] .r{border-color:var(--acc)}
.opt[aria-pressed="true"] .r::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--acc)}
.opt b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em}
.opt span.d{display:block;font-size:15.5px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.opt .reco{display:inline-block;font-size:13.5px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:2px 10px;margin-top:9px}
.opt[aria-pressed="true"] .reco{background:var(--card)}

/* ---------- Le texte écrit ---------- */
.doc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:30px 32px;font-size:17px;line-height:1.72;box-shadow:var(--lift)}
.doc p{margin:0 0 16px}
.doc p:last-child{margin-bottom:0}
.doc table{border-collapse:collapse;width:100%;font-size:15.5px;margin:6px 0 18px;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:1px solid var(--rule);padding:9px 10px;text-align:right;white-space:nowrap}
.doc th:first-child,.doc td:first-child{text-align:left}
.doc th{font-weight:600;color:var(--ink-2);font-size:14px}
.tw{overflow-x:auto}
.doc mark{background:var(--warn-soft);color:var(--warn);font-weight:500;padding:1px 6px;border-radius:5px;font-size:15.5px}
.caret{display:inline-block;width:8px;height:1.05em;background:var(--acc);vertical-align:-2px;margin-left:2px}
.writing{display:flex;align-items:center;gap:11px;color:var(--ink-2);font-size:16px;margin-bottom:18px}
.writing i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:block;flex:none}
.flag{display:flex;flex-direction:column;gap:4px;background:var(--warn-soft);border-radius:10px;padding:15px 18px;margin-top:18px;font-size:15.5px;line-height:1.5;color:var(--ink)}
.flag b{color:var(--warn)}
.ask{font-size:19px;font-weight:600;margin:30px 0 4px}

/* ---------- Attente ---------- */
.run{list-style:none;padding:0;display:grid;gap:18px;margin-top:32px;max-width:46ch}
.run li{display:flex;gap:14px;align-items:center;color:var(--ink-3);font-size:17px}
.run li.ok,.run li.go{color:var(--ink)}
.run .d{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule-2);flex:none;position:relative}
.run li.ok .d{background:var(--acc);border-color:var(--acc)}
.run li.ok .d::after{content:"";position:absolute;left:6px;top:3px;width:4px;height:8px;border:solid var(--acc-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.run li.go .d{border-color:var(--acc);border-right-color:transparent;border-top-color:transparent}

/* ---------- Comparaison d'un désaccord ---------- */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 4px}
.vs-c{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px}
.vs-v{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.vs-d{display:block;font-size:14.5px;color:var(--ink-2);margin-top:7px;line-height:1.45}

/* ---------- Projets et fichiers ---------- */
.rows{display:grid;gap:12px;margin-top:28px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.row:hover{border-color:var(--rule-2);background:var(--soft)}
.row b{display:block;font-size:19px;font-weight:600;letter-spacing:-.012em}
.row span.d{display:block;font-size:15px;color:var(--ink-2);margin-top:3px}
.row .st{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:132px}
.row .bar{width:132px;height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
.row .m{font-size:14px;color:var(--ink-3)}
.files{display:grid;gap:12px;margin-top:26px}
.file{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;flex-wrap:wrap}
.file b{display:block;font-size:18px;font-weight:600}
.file .m{display:block;font-size:14.5px;color:var(--ink-2);margin-top:2px}
.file .r{margin-left:auto;display:flex;gap:10px}
.file .go{padding:11px 18px;font-size:15.5px;min-height:46px}
.pap{width:36px;height:46px;background:var(--bg);border:1px solid var(--rule-2);border-radius:3px;flex:none;padding:7px 5px;display:flex;flex-direction:column;gap:4px}
.pap i{display:block;height:2px;border-radius:1px;background:var(--rule-2)}
.pap i:first-child{width:62%;background:var(--ink-3)}

/* ---------- Panneau escamotable ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:end center;pointer-events:none}
.sheet .bd{position:absolute;inset:0;background:rgba(20,22,26,.42);pointer-events:auto}
.sheet .pn{position:relative;pointer-events:auto;width:min(560px,100%);max-height:84vh;background:var(--bg);border:1px solid var(--rule-2);border-radius:16px 16px 0 0;overflow:auto;box-shadow:var(--lift);padding:24px 26px 30px}
@media (min-width:720px){.sheet{place-items:center}.sheet .pn{border-radius:16px;max-height:80vh}}
.sheet h2{font-size:22px;font-weight:600;letter-spacing:-.015em;padding-right:40px}
.sheet h2:focus{outline:none}
.sheet .x{position:absolute;top:18px;right:20px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:20px;line-height:1}
.sheet .x:hover{background:var(--soft);color:var(--ink)}
.pl{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:2px}
.pl li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;font-size:15.5px;color:var(--ink-3)}
.pl li.ok{color:var(--ink-2)}
.pl li.now{color:var(--ink);font-weight:600;background:var(--acc-soft)}
.pl .m{width:18px;height:18px;border-radius:50%;border:2px solid var(--rule-2);position:relative}
.pl li.ok .m{background:var(--acc);border-color:var(--acc)}
.pl li.ok .m::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pl li.now .m{border-color:var(--acc);border-width:5px}
.pl .g{font-size:13px;color:var(--ink-3);white-space:nowrap}
.mem{display:grid;gap:2px;margin-top:18px}
.mem-r{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding:11px 10px;border-radius:8px;align-items:start}
.mem-r:nth-child(odd){background:var(--card)}
.mem-k{display:block;font-size:14px;color:var(--ink-3)}
.mem-v{display:block;font-size:16px;line-height:1.45}
.mem-r.unknown .mem-v{color:var(--ink-3);font-style:italic}
.sd{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);margin-top:4px;flex:none;display:block}
.sd.user{background:var(--acc);border-color:var(--acc)}
.sd.inferred{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-top:14px}
.key span{display:inline-flex;gap:8px;align-items:center}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:10px;font-size:16px;z-index:70;box-shadow:var(--lift);max-width:90%}

@media (prefers-reduced-motion:no-preference){
  .fade{animation:f .38s ease both}
  @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .caret,.writing i{animation:bl 1.1s ease-in-out infinite}
  @keyframes bl{50%{opacity:.2}}
  .run li.go .d{animation:sp .85s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pg-b i{transition:width .45s ease}
}
@media (max-width:640px){
  body{font-size:16px}
  main,.hd-in,.pg-in{padding-left:16px;padding-right:16px}
  .col{padding:30px 0 64px}
  .q,.doc,.opt,.row,.file{padding-left:18px;padding-right:18px}
  .doc{padding-top:22px;padding-bottom:22px}
  .q-row{flex-direction:column}
  .dunno{width:100%;text-align:center}
  .vs{grid-template-columns:1fr}
  .go{width:100%}
  .after{flex-direction:column;align-items:flex-start;gap:14px}
  .row{grid-template-columns:1fr;gap:12px}
  .row .st{align-items:flex-start}
  .saved span{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-sheet" viewBox="0 0 16 20"><rect x="1" y="1" width="14" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.6 6.8h6.8M4.6 10h6.8M4.6 13.2h4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
<symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 .9v2M8 13.1v2M15.1 8h-2M2.9 8h-2M13 3l-1.4 1.4M4.4 11.6 3 13M13 13l-1.4-1.4M4.4 4.4 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.4 9.6A5.9 5.9 0 0 1 6.4 2.6a5.9 5.9 0 1 0 7 7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
</defs></svg>

<header class="hd"><div class="hd-in">
  <span class="brand"><svg aria-hidden="true"><use href="#i-sheet"/></svg>Esquisse</span>
  <div class="hd-r">
    <span class="saved" id="saved"></span>
    <div class="theme" role="group" aria-label="Thème de la page">
      <button type="button" data-set="light" aria-pressed="false" title="Mode clair"><svg aria-hidden="true"><use href="#i-sun"/></svg><span class="sr">Mode clair</span></button>
      <button type="button" data-set="dark" aria-pressed="false" title="Mode sombre"><svg aria-hidden="true"><use href="#i-moon"/></svg><span class="sr">Mode sombre</span></button>
    </div>
  </div>
</div></header>

<div id="pg"></div>
<main><div class="col" id="col" aria-live="polite"></div></main>
<div id="sheet"></div>

<script>
(function(){
  var root=document.documentElement, bs=[].slice.call(document.querySelectorAll(".theme button")),
      mq=matchMedia("(prefers-color-scheme: dark)");
  function cur(){ return root.getAttribute("data-theme") || (mq.matches?"dark":"light"); }
  function sync(){ var c=cur(); bs.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.set===c)); }); }
  bs.forEach(function(b){ b.addEventListener("click", function(){
    root.setAttribute("data-theme", b.dataset.set);
    try{ localStorage.setItem("esquisse-theme", b.dataset.set); }catch(e){}
    sync();
  }); });
  mq.addEventListener("change", sync); sync();
})();

(function(){
const el = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const nb = s => String(s).replace(/[  ]/g," ");
const eur = n => nb(Math.round(n).toLocaleString("fr-FR")) + " €";

const PLAN = [["BP","Problème, solution et proposition de valeur"],["BP","Porteurs de projet et équipe"],["CDC","Contexte et objectifs"],["CDC","Parties prenantes et utilisateurs"],["BP","Étude de marché"],["BP","Modèle économique"],["BP","Analyse concurrentielle"],["BP","Stratégie marketing et commerciale"],["BP","Plan opérationnel et jalons"],["CDC","Périmètre du projet"],["CDC","Exigences fonctionnelles"],["CDC","Exigences non fonctionnelles"],["CDC","Contraintes techniques et architecture"],["BP","Prévisionnel financier"],["BP","Besoin et plan de financement"],["BP","Risques et plan de mitigation"],["CDC","Livrables, planning et jalons"],["CDC","Budget et modalités"],["CDC","Recette et critères d'acceptation"],["CDC","Risques et points d'attention"],["BP","Résumé exécutif"]];
const DOCNAME = {BP:"Business plan", CDC:"Cahier des charges"};
const IDEA = "Une application qui met en relation des coachs sportifs indépendants et des particuliers pour des séances à domicile, avec réservation, paiement intégré et une commission sur chaque séance.";

function financial(pct){
  const s=[24000,36000,54000];
  const rows = s.map((v,i)=>`<tr><td>Année ${i+1}</td><td>${nb(v.toLocaleString("fr-FR"))}</td><td>${eur(v*45)}</td><td>${eur(v*45*pct/100)}</td></tr>`).join("");
  return [
    `<p>Le modèle repose sur une commission de ${pct} % prélevée sur chaque séance réservée, au prix moyen de 45 €. Avec 24 000 séances la première année et une croissance de 50 % par an, le chiffre d'affaires passe de ${eur(s[0]*45*pct/100)} à ${eur(s[2]*45*pct/100)} en trois ans.</p>`,
    `<div class="tw"><table><thead><tr><th></th><th>Séances</th><th>Volume d'affaires</th><th>Chiffre d'affaires</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    `<p>Faute d'information de votre part, j'ai estimé la masse salariale à <mark>90 000 € à vérifier</mark> pour la première année. Le besoin de trésorerie maximal dépend de <mark>votre apport initial à compléter</mark> que vous pourrez renseigner avant l'export.</p>`
  ];
}

/* ===== Avancement : un compte en clair et une estimation de temps ===== */
function progress(){
  if (!["travail","accords","generation","pret"].includes(S.v)) return "";
  const i = idx(), pct = Math.round(i/21*100);
  const mins = Math.max(1, Math.round((21-i)*0.8));
  const right = S.v==="travail"
    ? `<span class="pg-t"><b>Étape ${i+1} sur 21</b> — environ ${mins} min restantes</span>`
    : `<span class="pg-t"><b>Les 21 parties sont écrites</b></span>`;
  return `<div class="pg"><div class="pg-in">
    <span class="pg-b" role="img" aria-label="${pct} % du dossier écrit"><i style="width:${pct}%"></i></span>
    ${right}<button class="pg-a" data-s="plan">Voir le plan</button><button class="pg-a" data-s="memoire">Ce que je sais</button></div></div>`;
}
function saved(){
  return ["travail","accords","generation","pret"].includes(S.v)

/* ===== Panneaux escamotables : disponibles, jamais imposés ===== */
function sheetHTML(){
  if (!S.sheet) return "";
  const i = idx();
  if (S.sheet === "plan"){
    const items = PLAN.map((p,k)=>`<li class="${k<i?"ok":k===i?"now":""}"><span class="m"></span><span>${p[1]}</span><span class="g">${p[0]==="BP"?"Business plan":"Cahier des charges"}</span></li>`).join("");
    return `<div class="sheet"><div class="bd" data-a="close"></div><div class="pn" role="dialog" aria-modal="true" aria-label="Le plan de votre dossier">
      <button class="x" data-a="close" aria-label="Fermer">×</button>
      <h2 tabindex="-1">Le plan de votre dossier</h2>
      <p class="sub" style="margin-top:6px">${i} parties écrites sur 21. Je les prends dans cet ordre pour ne jamais vous redemander deux fois la même chose.</p>
      <ol class="pl">${items}</ol></div></div>`;
  }
  const rows = S.facts.length
    ? S.facts.map(f=>`<div class="mem-r ${f.src}"><span class="sd ${f.src}" aria-hidden="true"></span>

    : `<p class="sub" style="margin-top:16px">Rien pour l'instant. Ça se remplira au fil de vos réponses.</p>`;

    <div class="mem">${rows}</div></div>`;
}

function render(){
  el("saved").innerHTML = saved();
  el("pg").innerHTML = progress();
  el("col").className = "col" + (["travail","pret"].includes(S.v) ? " wide" : "");
  el("col").innerHTML = VIEWS[S.v]();
  el("sheet").innerHTML = sheetHTML();
  const t = document.querySelector(".toast"); if (t) t.remove();
  if (S.toast){ const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=S.toast; document.body.appendChild(d); }
}
function focusTop(){ const h = el("col").querySelector("h1.t"); if (h) h.focus({preventScroll:true}); }
function go(v){ clear(); S.v=v; S.errs={}; S.toast=""; S.sheet=null; render(); focusTop(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); }
function reco(){ if (S.acc[S.accI]===null) S.acc[S.accI]=ACCORDS[S.accI].reco; }
function toast(m){ S.toast=m; render(); timers.push(setTimeout(()=>{S.toast="";render();},2800)); }

function openCoachdom(){ clear(); S.scene=2; S.phase="questions"; S.version=1; S.blocks=99;
  S.facts=mk(FACTS_CD); S.acc=[null,null]; S.accI=0; S.ex=0; go("travail"); }
function openPret(){ clear(); S.scene=2; S.phase="fini"; S.version=2; S.facts=mk(FACTS_CD); S.acc=[0,0]; S.ex=0; go("pret"); }
function startNew(){ clear(); S.doc=2; S.idea=IDEA; S.facts=[]; S.scene=0; S.acc=[null,null]; S.accI=0; go("type"); }

function runAnalyze(){
  const step = reduce?340:900; S.an=0; go("analyse");
  [1,2,3].forEach(n=>timers.push(setTimeout(()=>{S.an=n;render();},step*n)));
  timers.push(setTimeout(()=>{ S.facts=mk(FACTS_IDEA); S.scene=0; S.phase="questions"; S.version=1; go("travail"); }, step*3+600));
}
function runGen(){
  const step = reduce?300:820; S.ex=0; go("generation");
  [1,2,3,4].forEach(n=>timers.push(setTimeout(()=>{S.ex=n;render();},step*n)));
  timers.push(setTimeout(()=>{ S.version=2; go("pret"); }, step*4+500));
}
function runDraft(){
  clear(); S.phase="ecriture"; S.blocks=1; render();
  const total = (S.version===1?SCENES[S.scene].draft:SCENES[S.scene].draft2)().length;
  const t = setInterval(()=>{
    if (S.blocks>=total){ clearInterval(t); S.phase="relecture"; render(); focusTop(); return; }
    S.blocks++; render();
  }, reduce?250:900);
  timers.push(t);
}
function sync(){
  if (S.v!=="travail" || S.phase!=="questions") return;
  SCENES[S.scene].questions.forEach((q,k)=>{ const i=el("f-q"+k); if(i) q.value=i.value; });
}
function setFact(label,value,src){
  const f = S.facts.find(x=>x.label===label);
  if (f){ f.value=value; f.src=src; } else S.facts.push({label,value,src});
}

document.addEventListener("input", e=>{
  const t=e.target;
  if (t.id==="f-idea"){ S.idea=t.value; t.classList.remove("bad"); const x=el("e-idea"); if(x){x.remove(); delete S.errs.idea;} }
  const m=t.id && t.id.match(/^f-q(\d+)$/);
  if (m){ t.classList.remove("bad"); const x=el("e-q"+m[1]); if(x){x.remove(); delete S.errs["q"+m[1]];} }
  if (t.id==="f-fb"){ t.classList.remove("bad"); const x=el("e-fb"); if(x){x.remove(); delete S.errs.fb;} }
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && S.sheet){ S.sheet=null; render(); } });

document.addEventListener("click", e=>{
  const sb=e.target.closest("[data-s]");
  if (sb){ S.sheet=sb.dataset.s; render(); const h=document.querySelector(".pn h2"); if(h) h.focus({preventScroll:true}); return; }
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  sync();
  if (a==="close"){ S.sheet=null; return render(); }
  if (a==="accueil") return go("accueil");
  if (a==="new") return startNew();
  if (a==="coachdom") return openCoachdom();
  if (a==="pret" || a==="reopen") return a==="reopen" ? (S.scene=2, S.phase="relecture", S.version=2, S.blocks=99, go("travail")) : openPret();
  if (a==="demo") return toast("Dans cette maquette, seul le projet CoachDom est ouvert.");
  if (a.startsWith("doc:")){ S.doc=+a.split(":")[1]; return render(); }
  if (a==="type") return go("type");
  if (a==="to-idea") return go("idee");
  if (a==="analyze"){
    if (S.idea.trim().length<20){ S.errs.idea="Deux ou trois phrases, le temps que je comprenne de quoi il s'agit."; render(); el("f-idea").focus(); return; }
    return runAnalyze();
  }
  if (a.startsWith("dunno:")){
    const k=+a.split(":")[1], q=SCENES[S.scene].questions[k];
    q.unknown=!q.unknown; delete S.errs["q"+k]; render();
    const f=el("f-q"+k); if(f) f.focus();
    return;
  }
  if (a==="answer"){
    const sc=SCENES[S.scene]; S.errs={};
    sc.questions.forEach((q,k)=>{ if(!q.unknown && !q.value.trim()) S.errs["q"+k]="Répondez, ou dites-moi que vous ne savez pas."; });
    if (Object.keys(S.errs).length){ render(); const f=el("f-q"+Object.keys(S.errs)[0].slice(1)); if(f) f.focus(); return; }
    sc.questions.forEach(q => q.unknown ? setFact(q.label,"À compléter plus tard","unknown") : setFact(q.label,q.value.trim(),"user"));
    S.version=1; return runDraft();
  }
  if (a==="approve" || a==="skip"){
    S.version=1;
    if (S.scene < SCENES.length-1){ S.scene++; S.phase="questions"; clear(); render(); focusTop(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); return; }
    S.phase="fini"; S.accI=0; reco(); return go("accords");
  }
  if (a==="revise"){ S.phase="revision"; render(); const f=el("f-fb"); if(f) f.focus(); return; }
  if (a==="revise-cancel"){ S.phase="relecture"; return render(); }
  if (a==="rerun"){
    const f=el("f-fb");
    if (!f || !f.value.trim()){ S.errs.fb="Dites-moi ce qu'il faut changer."; render(); el("f-fb").focus(); return; }
    SCENES[S.scene].revise=f.value; S.version=2;
    if (S.scene===2) setFact("Commission","15 % par séance","user");
    return runDraft();
  }
  if (a.startsWith("acc:")){ S.acc[S.accI]=+a.split(":")[1]; delete S.errs.acc; return render(); }
  if (a==="acc-prev"){ S.accI--; reco(); render(); focusTop(); return; }
  if (a==="acc-next"){
    if (S.acc[S.accI]===null){ S.errs.acc="Choisissez une des deux options pour continuer."; return render(); }
    if (S.accI < ACCORDS.length-1){ S.accI++; reco(); render(); focusTop(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); return; }
    return runGen();
  }
  if (a==="dl") return toast("Téléchargement simulé : la maquette ne produit aucun fichier.");
});

go("accueil");
})();
</script>
