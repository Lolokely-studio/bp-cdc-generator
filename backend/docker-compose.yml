# Nom de projet explicite. Sans lui, Compose le dérive du dossier qui contient
# ce fichier : le déplacement dans backend/ l'a fait passer de « bp-cdc-generator »
# à « backend », un nom assez générique pour entrer en collision avec un autre
# projet de la machine. L'épingler rend les conteneurs identifiables et stables
# quel que soit l'emplacement du fichier.
name: esquisse

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: esquisse
      POSTGRES_USER: esquisse
      POSTGRES_DB: esquisse_test
    ports: ["5433:5432"]

  # Même image que `render.yaml`, pour éprouver la conversion réelle en local
  # avant un déploiement.
  #
  # Les identifiants viennent de `backend/.env`, que Compose lit tout seul
  # pour ses substitutions : le conteneur attend donc exactement ce que le
  # backend envoie, et il n'y a qu'un endroit à changer. Sans eux, le repli
  # se déclencherait en silence sur un 401 et le PDF porterait la mention
  # « mise en page non fidèle » sans qu'on sache pourquoi.
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37.0-libreoffice
    environment:
      API_ENABLE_BASIC_AUTH: "true"
      GOTENBERG_API_BASIC_AUTH_USERNAME: ${GOTENBERG_USERNAME:?renseignez GOTENBERG_USERNAME dans backend/.env}
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${GOTENBERG_PASSWORD:?renseignez GOTENBERG_PASSWORD dans backend/.env}
      API_TIMEOUT: "120s"
    ports: ["3000:3000"]
