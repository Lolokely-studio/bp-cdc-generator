[project]
name = "esquisse"
version = "0.1.0"
description = "Générateur de cahier des charges et de business plan"
authors = [
    { name = "Aroniaina Manevatiana Lalaharisoa", email = "manevalalaharisoa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anyio>=4",
    "argon2-cffi>=23.1",
    "docxtpl[subdoc]>=0.20",
    "fastapi>=0.115",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "matplotlib>=3.11",
    "openai>=3.15.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: joint réellement les fournisseurs de modèles ; exclu par défaut",
]
# Les tests réseau consomment du quota et dépendent de la disponibilité de
# cinq services tiers : ils ne peuvent pas décider de la couleur de la suite.
# Ils se lancent à la demande, avec les vraies clés :
#     ESQUISSE_NETWORK_TESTS=1 uv run pytest -m network
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
