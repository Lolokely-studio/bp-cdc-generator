services:
  - type: web
    name: esquisse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_PORT
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_NAME
        sync: false
      # Paliers gratuits des fournisseurs de modèles. `sync: false` veut dire
      # « saisie dans le tableau de bord, jamais dans le dépôt ».
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_CLOUD_API_KEY
        sync: false
      # Explicite plutôt qu'implicite : en production le modèle simulé doit
      # être éteint, et le lire dans le fichier vaut mieux que le déduire.
      - key: ESQUISSE_FAKE_LLM
        value: "false"

  # Image officielle épinglée. Un service déployé depuis une image
  # pré-construite ne se redéploie pas tout seul : c'est voulu ici.
  # Il dort pendant toute la rédaction et n'est réveillé qu'à l'export,
  # parce que les 750 heures d'instance mensuelles sont partagées
  # entre tous les services de l'espace de travail.
  - type: web
    name: esquisse-gotenberg
    runtime: image
    image:
      url: docker.io/gotenberg/gotenberg:8
    plan: free
