  - id: references_appreciees
    libelle: "Références appréciées"
    type: liste
    question: "Quels sites ou applications aimez-vous, et pourquoi ?"
    deductible: false
    utilise_par: [cdc.charte_graphique]

  # ── CDC : planning, budget, recette, maintenance ─────────────────────────
  - id: date_livraison_souhaitee
    libelle: "Date de livraison souhaitée"
    type: date
    question: "Pour quand le produit doit-il être livré ?"
    deductible: false
    utilise_par: [cdc.livrables_planning, cdc.cadre_reponse]

  - id: contraintes_calendaires
    libelle: "Contraintes de calendrier"
    type: texte_long
